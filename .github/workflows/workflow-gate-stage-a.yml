name: Universal Workflow Gate Stage A

on:
  pull_request:
    paths:
      - "src/**"
      - "schemas/**"
      - "registry/**"
      - "test/**"
      - "docs/workflow-gate-stage-a.md"
      - "package.json"
      - ".github/workflows/workflow-gate-stage-a.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "schemas/**"
      - "registry/**"
      - "test/**"
      - "docs/workflow-gate-stage-a.md"
      - "package.json"
      - ".github/workflows/workflow-gate-stage-a.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
