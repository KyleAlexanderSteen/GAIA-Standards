name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  templates:
    name: Template integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate templates
        run: python standards/templates/validate_templates.py
      - name: Run template unit tests
        run: python -m unittest standards/templates/test_templates.py

  templates-verify:
    name: Template verification
    runs-on: ubuntu-latest
    needs: [templates]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent verification
        run: python standards/templates/verify.py

  stage-evidence:
    name: Stage-evidence integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest standards/ci/test_stage_evidence_check.py
      - name: Valid fixture must pass
        run: python standards/ci/stage_evidence_check.py --body standards/ci/fixtures/valid_pr.md
      - name: Invalid fixture must fail
        run: |
          if python standards/ci/stage_evidence_check.py --body standards/ci/fixtures/invalid_pr.md; then
            echo "expected failure on invalid fixture"
            exit 1
          fi
          echo "invalid fixture correctly rejected"

  stage-evidence-verify:
    name: Stage-evidence verification
    runs-on: ubuntu-latest
    needs: [stage-evidence]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent verification
        run: python standards/ci/verify.py

  simulation:
    name: Simulation integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scenario structure tests
        run: python -m unittest standards/simulation/test_scenarios.py
      - name: Run simulation integration
        run: python standards/simulation/run_scenarios.py

  simulation-verify:
    name: Simulation verification
    runs-on: ubuntu-latest
    needs: [simulation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent verification
        run: python standards/simulation/verify.py
