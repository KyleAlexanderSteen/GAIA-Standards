name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  templates:
    name: Template integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate templates
        run: python standards/templates/validate_templates.py
      - name: Run template unit tests
        run: python -m unittest standards/templates/test_templates.py

  verify:
    name: Template verification
    runs-on: ubuntu-latest
    needs: [templates]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent verification
        run: python standards/templates/verify.py
