name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  stage-evidence:
    name: Stage-evidence integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest standards/ci/test_stage_evidence_check.py
      - name: Valid fixture must pass
        run: python standards/ci/stage_evidence_check.py --body standards/ci/fixtures/valid_pr.md
      - name: Invalid fixture must fail
        run: |
          if python standards/ci/stage_evidence_check.py --body standards/ci/fixtures/invalid_pr.md; then
            echo "expected failure on invalid fixture"
            exit 1
          fi
          echo "invalid fixture correctly rejected"

  verify:
    name: Stage-evidence verification
    runs-on: ubuntu-latest
    needs: [stage-evidence]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent verification
        run: python standards/ci/verify.py
