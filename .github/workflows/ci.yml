name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  gaian-registry:
    name: GAIAN Registry schema tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run GAIAN registry validator tests
        run: python -m unittest standards/gaian-registry/test_validate_record.py

  gaian-registry:
    name: GAIAN Registry schema tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run GAIAN registry validator tests
        run: python -m unittest standards/gaian-registry/test_validate_record.py

  gaian-registry-verify:
    name: GAIAN Registry verification
    runs-on: ubuntu-latest
    needs: [gaian-registry]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent verification
        run: python standards/gaian-registry/verify.py
